{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h4 class="card-title">My Profile</h4>
        <dl class="row mb-0">
          <dt class="col-sm-4">Name</dt><dd class="col-sm-8">{{ user.full_name }}</dd>
          <dt class="col-sm-4">Email</dt><dd class="col-sm-8">{{ user.email }}</dd>
          <dt class="col-sm-4">Role</dt><dd class="col-sm-8">{{ user.role.name }}</dd>
          <dt class="col-sm-4">Department</dt><dd class="col-sm-8">{{ user.department or "-" }}</dd>
          <dt class="col-sm-4">Last login</dt><dd class="col-sm-8">{{ user.last_login_at or "-" }}</dd>
        </dl>
      </div>
    </div>
  </div>
</div>
{% endblock %}
